# "org" ensures this Service is used with the correct Serverless Framework Access Key.
#org: davidcher
# "service" is the name of this project. This will also be added to your AWS resource names.
service: sls-first

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-central-1
  memorySize: 512
  timeout: 10

functions:
  hello:
    handler: handler.hello
    events:
      - http:
          path: /
          method: get

resources:
  Outputs:
    NewServiceExport:
      Value: 'sls stack'
      Export:
        Name: ${self:custom.exportName}

