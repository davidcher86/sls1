 org: davidcher

service: sls-first

dashboard: false

plugins:
  - serverless-offline

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-central-1
  memorySize: 512
  timeout: 10
  disableDeprecations: true
  disableMonitoring: true

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /
          method: get


