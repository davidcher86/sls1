version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo Installing dependencies...
      - npm install -g serverless

  pre_build:
    commands:
      - echo Running pre-build commands...
#      - npm install
  build:
    commands:
      - echo Build started on `date`
      - npm install

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Running post-build commands...
      - serverless deploy --stack sls-test-s

artifacts:
  files:
    - '**/*'
  discard-paths: yes